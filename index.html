<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ulangan</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container" style="margin-top: 50px;">
        <div class="card">
            <h2 style="text-align: center; color: var(--bg-dark); margin-bottom: 20px;">Ulangan</h2>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="login-email" class="form-control" placeholder="Masukkan email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-password" class="form-control" placeholder="Masukkan password">
            </div>
            <button class="btn btn-primary" onclick="login()">Masuk</button>
            <p style="text-align: center; margin-top: 10px;">Belum punya akun? <a href="register.html">Daftar</a></p>
        </div>
    </div>
    <footer>
        <p>ULANGAN - SMKN 2 KOTA MOJOKERTO</p>
        <p>&copy; 2026 Muhammad Ilham Dwi Pramesdi. All Rights Reserved.</p>
        <p>Dikembangkan oleh Muhammad Ilham Dwi Pramesdi</p>
    </footer>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
