<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - Ulangan</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container" style="margin-top: 20px;">
        <div class="card">
            <h2 style="text-align: center; color: var(--bg-dark); margin-bottom: 20px;">Daftar Akun</h2>
            <div class="form-group"><label>Nama Lengkap</label><input type="text" id="reg-username" class="form-control" placeholder="Nama Lengkap"></div>
            <div class="form-group"><label>Email</label><input type="email" id="reg-email" class="form-control" placeholder="Email"></div>
            <div class="form-group"><label>Password</label><input type="password" id="reg-password" class="form-control" placeholder="Min 6 karakter"></div>
            
            <!-- KELAS SUDAH MENJADI SELECT -->
            <div class="form-group">
                <label>Kelas</label>
                <select id="reg-kelas" class="form-control" required>
                    <option value="">-- Pilih Kelas --</option>
                    <option value="X RPL 2">X RPL 2</option>
                    <option value="X RPL 3">X RPL 3</option>
                    <option value="X APHP 2">X APHP 2</option>
                </select>
            </div>

            <div class="form-group"><label>Nomor Absen</label><input type="number" id="reg-absen" class="form-control" placeholder="Contoh: 15"></div>
            <!-- Tambahkan alert('tes klik') di dalam onclick -->
            <button class="btn btn-primary" onclick="alert('Tombol berhasil diklik!'); register()">Daftar</button>
                    <p style="text-align: center; margin-top: 10px;">Sudah punya akun? <a href="index.html">Login</a></p>
        </div>
    </div>
    <footer>
        <p>ULANGAN - SMKN 2 KOTA MOJOKERTO</p>
        <p>&copy; 2026 Muhammad Ilham Dwi Pramesdi. All Rights Reserved.</p>
        <p>Dikembangkan oleh Muhammad Ilham Dwi Pramesdi</p>
    </footer>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
