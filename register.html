<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - Ulangan</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Library Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container" style="margin-top: 20px;">
        <div class="card">
            <h2 style="text-align: center; color: var(--bg-dark); margin-bottom: 20px;">Daftar Akun</h2>
            
            <div class="form-group">
                <label>Nama Lengkap</label>
                <input type="text" id="reg-username" class="form-control" placeholder="Nama Lengkap">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="reg-email" class="form-control" placeholder="Email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="reg-password" class="form-control" placeholder="Min 6 karakter">
            </div>
            <div class="form-group">
                <label>Kelas</label>
                <select id="reg-kelas" class="form-control" required>
                    <option value="">-- Pilih Kelas --</option>
                    <option value="X RPL 2">X RPL 2</option>
                    <option value="X RPL 3">X RPL 3</option>
                    <option value="X APHP 2">X APHP 2</option>
                </select>
            </div>
            <div class="form-group">
                <label>Nomor Absen</label>
                <input type="number" id="reg-absen" class="form-control" placeholder="Contoh: 15">
            </div>
            
            <button class="btn btn-primary" onclick="prosesDaftar()">Daftar</button>
            <p style="text-align: center; margin-top: 10px;">Sudah punya akun? <a href="index.html">Login</a></p>
        </div>
    </div>

    <footer>
        <p>ULANGAN - SMKN 2 KOTA MOJOKERTO</p>
        <p>&copy; 2026 Muhammad Ilham Dwi Pramesdi. All Rights Reserved.</p>
        <p>Dikembangkan oleh Muhammad Ilham Dwi Pramesdi</p>
    </footer>

    <!-- MEMANGGIL FILE CONFIG.JS -->
    <script src="js/config.js"></script>

    <!-- SCRIPT DAFTAR LANGSUNG DI SINI -->
    <script>
        async function prosesDaftar() {
            try {
                // 1. Ambil data
                const email = document.getElementById('reg-email').value;
                const password = document.getElementById('reg-password').value;
                const username = document.getElementById('reg-username').value;
                const kelas = document.getElementById('reg-kelas').value;
                const absen = document.getElementById('reg-absen').value;

                // 2. Cek form kosong
                if(!email || !password || !username || !kelas || !absen) {
                    alert("Isi semua kolom form terlebih dahulu!");
                    return;
                }

                alert("Sedang menghubungi server..."); // Penanda 1

                // 3. Proses ke Supabase
                const { data, error } = await supabase.auth.signUp({
                    email: email, 
                    password: password,
                    options: { data: { username, kelas, absen } }
                });

                // 4. Cek hasil
                if (error) { 
                    alert("GAGAL DARI SUPABASE:\n" + error.message); 
                } else { 
                    alert("BERHASIL! Silakan login."); 
                    window.location.href = 'index.html'; 
                }

            } catch (err) {
                // Menangkap error JavaScript murni (misal Supabase tidak terbaca)
                alert("ERROR JAVASCRIPT:\n" + err.message);
            }
        }
    </script>
</body>
</html>
